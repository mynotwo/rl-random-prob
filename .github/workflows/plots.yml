name: GPU-free published results
"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plots:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-plot.txt
      - name: Install only plotting dependencies
        run: python -m pip install -r requirements-plot.txt
      - name: Verify source and regression checks without torch
        run: |
          python -c "import importlib.util; assert importlib.util.find_spec('torch') is None"
          python -m compileall -q scripts tests src/checkpoint_curve/plot_three_scores.py src/cross_model/summarize.py
          python -m unittest discover -s tests -v
          (cd src/trainer && python test_protocol.py)
          (cd src/checkpoint_scan && python test_contract.py)
          python scripts/export_paper_results.py --check
      - name: Redraw published CSVs offline
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          CUDA_VISIBLE_DEVICES: ''
        run: python scripts/plot_results.py --out-dir outputs/paper
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: published-results-py${{ matrix.python }}
          path: |
            outputs/paper/
            results/*.csv
            results/paper_tables.json
          if-no-files-found: error
